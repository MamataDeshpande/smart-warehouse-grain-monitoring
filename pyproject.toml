[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-warehouse-grain-monitoring"
version = "0.1.0"
description = "Grain-storage IoT monitoring project with sensor simulation, ThingSpeak interface and dashboard"
requires-python = ">=3.10"
authors = [{name = "Mamata Deshpande"}]
license = "MIT"
dependencies = []
readme = "README.md"

[project.scripts]
grain-monitor = "grain_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
